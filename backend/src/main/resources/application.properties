spring.application.name=CosmoSchools

# Valores solo de este equipo (como la contrasena local de MySQL). Ese archivo esta en
# .gitignore y nunca se sube a GitHub; si no existe (por ejemplo en el servidor), se ignora.
spring.config.import=optional:file:./application-local.properties

# Conexion a MySQL. En el servidor se definen DB_URL/DB_USERNAME/DB_PASSWORD como variables
# de entorno. Si no se define DB_PASSWORD se usa la contrasena local de abajo (o la de
# application-local.properties si existe). Un MySQL remoto normalmente exige SSL, asi que
# el DB_URL de produccion debe llevar useSSL=true (el proveedor de hosting lo indica).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cosmo_schools?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:naranjaS21}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
# Imprimir cada consulta SQL ayuda en desarrollo, pero en produccion llena los logs:
# alli definir SHOW_SQL=false.
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:true}

# Puerto del servidor. La mayoria de hostings gratis (Render, Railway, etc.) asignan
# el puerto ellos mismos por la variable de entorno PORT; en este equipo sigue usando 8085.
server.port=${PORT:8085}

# Nunca mandar el stack trace en la respuesta JSON de un error (fuga de información);
# los @ExceptionHandler de GlobalExceptionHandler cubren los casos esperados igual.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# Swagger/OpenAPI quedan accesibles sin login (útil en desarrollo para probar la API).
# En producción, definir SWAGGER_ENABLED=false para que nadie en internet pueda ver
# la documentación completa de todos los endpoints de la API.
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# Origenes permitidos por CORS, separados por coma.
# En produccion, definir CORS_ALLOWED_ORIGINS con el dominio real del frontend.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5174}

# Secreto para firmar los tokens JWT (HS256, minimo 32 caracteres) y su duracion.
# El valor por defecto es solo para desarrollo local: en produccion es obligatorio
# definir JWT_SECRET como variable de entorno con un valor propio y secreto.
jwt.secret=${JWT_SECRET:cosmo-schools-desarrollo-local-cambiar-en-produccion-0123456789}
# El access token (JWT) ahora dura poco (30 min) porque el frontend lo renueva solo
# usando el refresh token; asi, si alguien lo roba, sirve muy poco tiempo.
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}
# El refresh token dura mas (7 dias) y se puede revocar porque vive en la base de datos.
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Primer usuario ADMIN (ver AdminInicialConfig). Solo se usa si todavia no existe ningun admin.
admin.inicial.email=${ADMIN_EMAIL:}
admin.inicial.password=${ADMIN_PASSWORD:}
admin.inicial.nombre=${ADMIN_NOMBRE:Administrador}
